apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: grand-residency
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: grand-residency-backend:latest
          imagePullPolicy: Never  # Tells Minikube to use locally built docker image
          ports:
            - containerPort: 5050
          env:
            - name: PORT
              value: "5050"
            - name: MONGO_URI
              value: "mongodb://mongodb:27017/hoteldb"
          readinessProbe:
            httpGet:
              path: /health
              port: 5050
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: grand-residency
spec:
  selector:
    app: backend
  ports:
    - port: 5050
      targetPort: 5050
  type: ClusterIP
