apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: grand-residency
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: grand-residency-frontend:latest
          imagePullPolicy: Never  # Tells Minikube to use locally built docker image
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: grand-residency
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
